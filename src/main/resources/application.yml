app:
  title: Shop
  url: https://localhost:5443
  supported-languages: en, pl, uk, es, it, fr, cs, nl, no, de, ru, zh
  data-path: data
  upload:
    max-file-size: 100MB
  load-sample-data: true
shop:
  currency: PLN
  delivery:
    price:
      express: 20.
      standard: 13.5
      pickup: 0.
    waiting-days:
      express: 3
      standard: 5
      pickup: 0
security:
  password:
    min-length: 3
    require-uppercase: false
    require-numeric: false
spring:
  application:
    name: shop
  main:
    banner-mode: off
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
      path: /h2
  datasource:
    url: jdbc:h2:file:./data/db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: akotu.mywire@gmail.com
    password: 'password'
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port.http: 5080
  port: 5443
  ssl:
    enabled: true
    key-alias: tomcat-shop
    key-password: "password"
    key-store: file:ssl/key.jks
    key-store-provider: SUN
    key-store-type: JKS
    key-store-password: "password"
  error:
    include-binding-errors: always
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 8h
      cookie:
        max-age: 28800
        http-only: true
        secure: true
        same-site: lax