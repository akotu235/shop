<!DOCTYPE html>
<html th:lang="#{lang.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${@environment.getProperty('app.title')}"></title>
    <style th:replace="~{fragments/style/general :: style}"></style>
    <style th:replace="~{fragments/style/header :: style}"></style>
    <style th:replace="~{fragments/style/links :: style}"></style>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div id="content">
    <aside></aside>
    <main>
        <ul id="links">
            <li>
                <a class="hover-area"
                   href="seller-panel/new-product"
                   th:text="#{seller-panel.button.add-product}"></a>
            </li>
            <li>
                <a class="hover-area"
                   href="seller-panel/new-category"
                   th:text="#{seller-panel.button.add-category}"></a>
            </li>
            <li>
                <a class="hover-area"
                   href="/seller-panel/orders"
                   th:text="#{seller-panel.button.orders}"></a>
            </li>
        </ul>
    </main>
    <aside></aside>
</div>
<script th:src="@{/script.js}"></script>
</body>
</html>
